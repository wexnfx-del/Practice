<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive Lab</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                font-family: Arial, sans-serif;
                max-width: 900px;
                margin: 0 auto;
                padding: 1rem;
            }
            .lede {
                font-size: clamp(1.1rem, 2.5vw + 0.5rem, 1.6rem);
            }
            img {
                max-width: 100%;
                height: auto;
                display: block;
                border-radius: 8px;
            }
            .features {
                display: grid;
                gap: 1rem;
            }
            .feature {
                background-color: #b45f36;
                color: #fffaf3;
                padding: 2rem;
                border-radius: 8px;
                font-weight: 700;
                text-align: center;
            }
            @media (min-width:500px) {
                .features {
                    grid-template-columns: 1fr 1fr;
                }
            }
        </style>
    </head>
    <body>
        <h1>Responsive Lab</h1>

        <h2>1. Fluid type</h2>
        <p class="lede">This paragraph grown and shrinks with the window, but never past its limits.</p>

        <h2>2. Breakpoint layout</h2>
        <div class="features">
            <div class="feature">One</div>
            <div class="feature">Two</div>
        </div>

        <h2>3. Fluid images</h2>
        <img src="https://picsum.photos/seed/bakery/800/400" alt="Bakery photo that scales with its container" />
    </body>
</html>
