<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Lab</title>
    <style>
        * {
  box-sizing: border-box;
}
body {
  font-family: Arial, sans-serif;
  max-width: 900px;
  margin: 0 auto;
  padding: 1rem;
}
.box {
  background-color: #5c2f1f;
  color: #fffaf3;
  padding: 1.5rem;
  border-radius: 8px;
  font-weight: 700;
  text-align: center;
}
.grid {
  display: grid;
  gap: 0.75rem;
  border: 2px dashed #dcc9b7;
  padding: 0.5rem;
  border-radius: 8px;
  margin-bottom: 2rem;
}
.tracks-demo {
  grid-template-columns: 1fr 1fr 1fr;
  grid-auto-rows: 90px;
}
.wide {
    grid-column: span 2;
}
.tall {
    grid-row: span 2;
}

.responsive-demo {
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
}
    </style>
    </head>
    <body>
        <h1>Grid Lab</h1>

       
  <h2>1. Tracks</h2>
  <div class="grid tracks-demo">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
  </div>

  <h2>2. Placement</h2>  
      <div class="grid place-demo">
    <div class="box wide">A</div>
    <div class="box">B</div>
    <div class="box">C</div>
    <div class="box tall">D</div>
    <div class="box">E</div>
  </div>

  <h2>3. Responsive</h2>
    <div class="grid responsive-demo">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
  </div>
    </body>
</html>
